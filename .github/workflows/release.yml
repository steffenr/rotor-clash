name: Release — Deploy to netcup

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (semver)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_note:
        description: 'Optional release note (added to the GitHub Release)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, Build & Deploy to netcup Webhosting 4000
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Error: Releases can only be started from main (selected: ${GITHUB_REF_NAME})." >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW_VERSION="$(npm version "$BUMP" --no-git-tag-version)"
          if git rev-parse -q --verify "refs/tags/${NEW_VERSION}" >/dev/null; then
            echo "Error: Tag ${NEW_VERSION} already exists." >&2
            exit 1
          fi
          echo "tag=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${NEW_VERSION} (${BUMP})"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run automated test suite
        run: npm test

      - name: Build frontend & server bundle
        run: |
          npm run build
          npm run build:server

      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          for var_name in SSH_HOST SSH_USER DEPLOY_PATH SSH_PRIVATE_KEY; do
            if [ -z "${!var_name}" ]; then
              echo "Error: Missing required GitHub Secret or Variable: $var_name" >&2
              exit 1
            fi
          done

      - name: Deploy files via SSH & restart Plesk Passenger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          # Ensure target directories exist without disturbing existing data/leaderboard.json
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH' '$DEPLOY_PATH/tmp' '$DEPLOY_PATH/data'"

          # Package production release payload into a compressed archive
          tar -czf /tmp/rotor-clash-release.tar.gz \
            package.json \
            app.js \
            .nvmrc \
            .node-version \
            dist \
            dist-server \
            src/data

          # Upload archive via SCP (universally supported on all SSH hosts, no remote rsync dependency)
          scp -P "$SSH_PORT" -i ~/.ssh/deploy_key /tmp/rotor-clash-release.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/rotor-clash-release.tar.gz"

          # Extract cleanly, remove archive, install production dependencies using Plesk Node.js & reload Passenger
          # The remote script runs via `bash -s`, so it does not depend on the server's login-shell PATH.
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -l -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          tar -xzf rotor-clash-release.tar.gz
          rm -f rotor-clash-release.tar.gz

          # Find an npm: prefer the Plesk Node.js version from .nvmrc, then the newest installed one,
          # then whatever is already on PATH.
          WANT="$(tr -d '[:space:]v' < .nvmrc)"
          NODE_BIN=""
          if ! command -v npm >/dev/null 2>&1; then
            PLESK_DIRS="$(ls -d /opt/plesk/node/*/bin 2>/dev/null | sort -t/ -k5 -nr | tr '\n' ' ' || true)"
            NVM_DIRS="$(ls -d "$HOME"/.nvm/versions/node/*/bin 2>/dev/null | sort -r | tr '\n' ' ' || true)"
            CANDIDATES="/opt/plesk/node/${WANT}/bin ${PLESK_DIRS} ${NVM_DIRS} /usr/local/bin /usr/bin"
            for dir in $CANDIDATES; do
              if [ -x "$dir/npm" ] && [ -x "$dir/node" ]; then
                export PATH="$dir:$PATH"
                break
              fi
            done
          fi
          if ! command -v npm >/dev/null 2>&1; then
            echo "Error: npm not found on the server (wanted Node ${WANT})." >&2
            echo "PATH=$PATH" >&2
            echo "--- /opt/plesk ---" >&2
            ls -la /opt/plesk 2>&1 >&2 || true
            echo "--- /opt/plesk/node ---" >&2
            ls -la /opt/plesk/node 2>&1 >&2 || true
            echo "--- ~/.nvm ---" >&2
            ls -la "$HOME/.nvm" 2>&1 >&2 || true
            echo "--- which node/npm/nodejs ---" >&2
            command -v node npm nodejs >&2 || true
            echo "--- find */bin/npm ---" >&2
            find /opt /usr/local /usr/lib "$HOME" -maxdepth 6 -name npm -path '*bin*' 2>/dev/null | head -20 >&2 || true
            exit 1
          fi

          echo "Using node $(node -v) and npm $(npm -v) from $(dirname "$(command -v npm)")"
          npm install --omit=dev
          touch tmp/restart.txt
          REMOTE

      - name: Commit version, create tag & push to main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add package.json
          if [ -f package-lock.json ]; then git add package-lock.json; fi
          git commit -m "chore(release): ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin HEAD:main "${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTE: ${{ inputs.release_note }}
        run: |
          printf '%s\n' "$RELEASE_NOTE" > release-note.txt
          gh release create "$TAG" \
            --title "Rotor Clash ${TAG}" \
            --generate-notes \
            --notes-file release-note.txt \
            --verify-tag

      - name: Write deployment summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BUMP: ${{ inputs.bump }}
          RELEASE_NOTE: ${{ inputs.release_note }}
        run: |
          {
            echo "### Rotor Clash ${TAG} deployed to netcup"
            echo "- **Bump:** \`${BUMP}\`"
            echo "- **Tag:** \`${TAG}\`"
            echo "- **Commit:** \`$(git rev-parse HEAD)\`"
            echo "- **Note:** ${RELEASE_NOTE:-–}"
          } >> "$GITHUB_STEP_SUMMARY"
