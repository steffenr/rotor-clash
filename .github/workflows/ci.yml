name: CI — Lint, Test & Build

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run automated test suite
        run: npm test

      - name: Audit production dependencies (fail on high severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend (Vite + Tailwind 4 + Alpine.js)
        run: npm run build

      - name: Build server bundle (Node CJS)
        run: npm run build:server
