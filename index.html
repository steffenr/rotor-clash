<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rotor Clash — Wind Energy Technical Card Duel</title>
    <meta name="theme-color" content="#F5EFE0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="application-name" content="Rotor Clash" />
    <meta name="apple-mobile-web-app-title" content="Rotor Clash" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Apply the saved/system theme before first paint to avoid a light flash.
      (function () {
        try {
          var t = localStorage.getItem('rotor_clash_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0F1D26');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Real-time 2-player multiplayer Quartet card game featuring verified technical specifications of modern wind turbines and global wind power plants, interactive onboarding, and ELO rankings. Concept images are AI-generated." />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <meta property="og:title" content="Rotor Clash — Wind Energy Technical Card Duel" />
    <meta property="og:description" content="Compete head-to-head in real-time multiplayer Quartet duels with verified wind turbine and wind power plant engineering specs. Concept images are AI-generated." />
    <meta property="og:image" content="/assets/aistudio/logo_rotor_clash_3a6e5dcc.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-c-canvas text-c-ink antialiased selection:bg-c-teal/25 selection:text-c-ink">
    <div id="app" x-data="rotorClashApp()" x-cloak></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
